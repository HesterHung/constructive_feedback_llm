<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Playground (with PDF)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .container { display: flex; width: 100%; }
        .panel { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
        .panel:first-child { border-right: 2px solid #ddd; max-width: 350px; } /* Give controls a fixed width */
        h2 { margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        h3 { margin-bottom: 5px; }
        textarea { width: 98%; font-family: monospace; font-size: 14px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #system-prompt { height: 100px; }
        #new-message-prompt { height: 100px; margin-top: 15px; }
        #chat-log { background-color: #ffffff; white-space: pre-wrap; word-wrap: break-word; flex-grow: 1; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 10px; align-items: center; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; flex-grow: 1; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #aaa; }
        #new-chat-button { background-color: #dc3545; }
        #new-chat-button:hover { background-color: #c82333; }
        select, input[type="file"] { padding: 8px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">
            <h2>Controls</h2>
            
            <div class="controls">
                <div class="controls-row">
                    <button id="send-button">Send</button>
                    <button id="new-chat-button">New Chat</button>
                </div>
                
                <select id="model-select">
                    <option value="tngtech/deepseek-r1t-chimera:free">DeepSeek R1T Chimera (free)</option>
                    <option value="deepseek/deepseek-v3.1:free">DeepSeek V3.1 (free)</options>
                    <option value="deepseek/deepseek-r1-0528-qwen3-8b:free">DeepSeek R1 Qwen3 8B (free)</Goption>
                    <option value="google/gemini-pro">Google Gemini Pro</option>
                    <option value="openai/gpt-4o">OpenAI GPT-4o</option>
                </select>
                
                <input type="file" id="pdf-upload" accept=".pdf">
            </div>

            <h3>System Prompt</h3>
            <textarea id="system-prompt" placeholder="You are a helpful assistant. (Applied at the start of a new chat)"></textarea>
            
            <h3>New Message</h3>
            <textarea id="new-message-prompt" placeholder="Type your message here..."></textarea>
        </div>

        <div class="panel">
            <h2>Chat Log</h2>
            <textarea id="chat-log" readonly placeholder="Chat history will appear here..."></textarea>
        </div>
    </div>

    <script>
        // --- Element References ---
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');
        const systemPromptEl = document.getElementById('system-prompt');
        const userMessageEl = document.getElementById('new-message-prompt'); // Renamed
        const modelSelectEl = document.getElementById('model-select');
        const pdfUploadEl = document.getElementById('pdf-upload');
        const chatLogEl = document.getElementById('chat-log'); // Renamed

        const API_ENDPOINT = 'http://127.0.0.1:5000/run-prompt';

        // --- Chat State ---
        let currentMessages = [];

        // --- Helper Function to Render History ---
        function renderChatLog() {
            chatLogEl.value = ""; // Clear the log
            for (const message of currentMessages) {
                let role = message.role.toUpperCase();
                
                if (role === "ASSISTANT") {
                    role = "AI";
                } else if (role === "SYSTEM") {
                    chatLogEl.value += `[${role}] ${message.content}\n`;
                    continue; // Don't add extra newlines for system
                }
                chatLogEl.value += `\n--- [${role}] ---\n${message.content}\n`;
            }
            // Auto-scroll to bottom
            chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }

        // --- Event Listener for NEW CHAT Button ---
        newChatButton.addEventListener('click', () => {
            currentMessages = [];
            chatLogEl.value = "New chat started.";
            systemPromptEl.disabled = false;
            userMessageEl.value = "";
            pdfUploadEl.value = null; // Clear file input
        });

        // --- Event Listener for SEND Button ---
        sendButton.addEventListener('click', async () => {
            const newMessage = userMessageEl.value;
            const pdfFile = pdfUploadEl.files[0];
            const systemPrompt = systemPromptEl.value;

            if (!newMessage) {
                alert('Please enter a message.');
                return;
            }

            // --- Disable UI ---
            sendButton.disabled = true;
            userMessageEl.disabled = true;
            chatLogEl.value += "\n\n--- [AI] ---\nThinking...";
            chatLogEl.scrollTop = chatLogEl.scrollHeight;

            // --- Handle First Message (System Prompt) ---
            if (currentMessages.length === 0 && systemPrompt) {
                currentMessages.push({ role: "system", content: systemPrompt });
                systemPromptEl.disabled = true; // Lock system prompt after chat starts
            }
            
            // --- 1. Use FormData to send files and data ---
            const formData = new FormData();
            
            // --- 2. Add all our form fields ---
            formData.append('messages', JSON.stringify(currentMessages)); // Send current history
            formData.append('new_user_message', newMessage); // Send new message
            formData.append('model', modelSelectEl.value);
            
            if (pdfFile) {
                formData.append('pdf_file', pdfFile);
            }

            try {
                // --- 3. Send the request ---
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: formData 
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || `HTTP error! Status: ${response.status}`);
                }

                // --- 4. Get UPDATED history from backend ---
                const data = await response.json();
                currentMessages = data.messages; // ** CRITICAL: Resync state **

                // --- 5. Re-render the entire chat log ---
                renderChatLog();

            } catch (error) {
                chatLogEl.value += `\n\n[ERROR] ${error.message}`;
                console.error('Fetch error:', error);
            } finally {
                // --- Re-enable UI ---
                sendButton.disabled = false;
                userMessageEl.disabled = false;
                userMessageEl.value = ""; // Clear the input box
                pdfUploadEl.value = null; // Clear the file input
                userMessageEl.focus();
            }
        });
    </script>
</body>
</html>
